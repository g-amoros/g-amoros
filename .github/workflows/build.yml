name: Mise à jour du profil
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.py, avatar.png]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python build.py
        env:
          # PAT classique : scopes read:user + repo (pour compter les contributions privées)
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: mise à jour des stats du profil" && git push
